[package]
name = "klip-app"
description = "Klip desktop app: tray, windows, overlay (a Tauri 2 shell over klip-engine)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
cpal.workspace = true
klip-control.workspace = true
klip-engine.workspace = true
klip-platform.workspace = true
klip-probe.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.5"
tauri-plugin-single-instance = "2.5"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Serve the built front end (dist/) from the executable. On by default so `cargo build`
# and `cargo run` give a working app; for UI work with hot reload run `npm run dev` and
# `cargo run -p klip-app --no-default-features` (the app then loads devUrl).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
