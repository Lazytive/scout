[package]
name = "klip-platform"
description = "OS integration for Klip: GPU adapters, windows, monitors. The only crate allowed `unsafe`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
trash.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast", "global_shortcuts"] }
# 0.3.50: `pw_stream_get_time_n` (stream times with the delay filled in).
pipewire = { version = "0.10", features = ["v0_3_50"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
pollster.workspace = true
rustix = { version = "1", features = ["fs", "param", "time"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
gstreamer.workspace = true
gstreamer-video.workspace = true
tracing.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Wdk_System_SystemServices",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core.workspace = true

[dev-dependencies]
klip-settings.workspace = true
tempfile.workspace = true

[lints]
workspace = true
